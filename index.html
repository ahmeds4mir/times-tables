<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7B61FF">
  <title>جدول الضرب</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="جدول الضرب">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chapter1.css">
  <link rel="stylesheet" href="css/chapter2.css">
  <link rel="stylesheet" href="css/engine.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="topbar">
    <button id="homeBtn" class="icon-btn" type="button">🏠</button>
    <h1 id="appTitle"></h1>
    <div class="top-actions">
      <button id="langBtn" class="icon-btn" type="button"></button>
      <button id="soundBtn" class="icon-btn" type="button"></button>
    </div>
  </header>

  <main id="app"></main>

  <div id="rotate" aria-hidden="true">
    <span class="rotate-phone">📱</span>
    <b>أدر الهاتف للوضع الطولي</b>
    <span>Please turn your phone upright</span>
  </div>

  <script src="js/profile.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/intros.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chapter1.js"></script>
  <script src="js/chapter2.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/chapters/ch3.js"></script>
  <script src="js/chapters/ch4.js"></script>
  <script src="js/chapters/ch5.js"></script>
  <script src="js/chapters/ch6.js"></script>
  <script src="js/chapters/ch7.js"></script>
  <script src="js/chapters/ch8.js"></script>
  <script src="js/chapters/ch9.js"></script>
  <script src="js/chapters/ch10.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
